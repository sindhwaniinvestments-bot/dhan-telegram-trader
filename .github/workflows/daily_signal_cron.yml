name: 24/7 Cloud Trade Tracker & Daily 9:00 AM Telegram Briefing

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST (Indian Standard Time)
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  run-trade-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv flask gunicorn

      - name: Execute Daily 9:00 AM Signal Scan & Dispatch Telegram Digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_daemon.py --single-run

      - name: Commit & Push Updated Trade Data to Main & gh-pages Branches
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add active_trades.json trade_history.csv dashboard_data.json daemon_execution.log .nojekyll || true
          git commit -m "Auto-update active trades & cloud dashboard data [skip ci]" || true
          git push origin main || true
          
          # Sync to gh-pages branch for live web URL hosting
          git checkout -B gh-pages
          git push -f origin gh-pages
